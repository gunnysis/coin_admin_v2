# iOS 프로덕션 빌드 후 App Store Connect 제출
# 수동 실행 전용: npx eas-cli@latest workflow:run ios-production.yml
# (main push 자동 트리거는 2026-07 비활성화 — SDK 54가 Apple Xcode 26 제출 요건을 충족하지 못해
#  push마다 빌드 실패가 반복됨. SDK 55+ 업그레이드 후 재활성화: docs/planning/upgrade-modernization.md §2.2)
# 전제: Apple App Store Connect API 키 등 iOS 제출 크레덴셜이 Expo 대시보드에 연결되어 있어야 함
name: iOS Production Build and Submit

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
