# Android 프로덕션 빌드 후 Play Store 제출
# GitHub main 브랜치 push 시 자동 실행 (Expo 대시보드에서 저장소 연결 필요)
# 수동 실행: npx eas-cli@latest workflow:run android-production.yml
# 빌드 전 checks job이 실패하면 빌드·제출이 실행되지 않는다 (push = 무검증 배포 방지)
name: Android Production Build and Submit

on:
  push:
    branches: [main]
    # 문서·GitHub CI·워크플로 정의만 바뀐 push는 스토어 배포를 트리거하지 않음 (versionCode·심사 낭비 방지)
    # 주의: EAS 매처는 `!**/*.md`가 루트 파일(README.md 등)과 매치되지 않는다 — `!*.md` 병기 필수
    # (2026-07-28 실측: docs 전용 push가 필터를 통과해 빌드 46이 제출된 사고. GitHub Actions와 다름)
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!*.md"
      - "!.github/**"
      - "!.eas/**"

# 새 push가 오면 진행 중인 구 배포 런을 취소 (최신 커밋만 배포)
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

# Node 버전 단일 소스는 .nvmrc — 값이 갈라지면 sync:version:check가 실패한다.
# 정확한 버전 핀(메이저만 지정 금지): 내장 npm이 바뀌면 lockfile 검증이 로컬과 갈라짐
defaults:
  tools:
    node: "24.18.0"

jobs:
  checks:
    name: Pre-build checks
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Version/config sync check
        run: npm run sync:version:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npx jest --ci

  build_android:
    name: Build Android
    needs: [checks]
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Play Store
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
