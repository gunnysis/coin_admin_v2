# PR·main push 시 검증. main 머지 = EAS 배포이므로 PR 단계 검증이 1차 방어선,
# EAS 워크플로의 pre-build checks job이 최종 게이트.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소 (최신 커밋만 검증)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version sync check
        run: npm run sync:version:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # 의존성 호환성 진단 (SDK-패키지 버전 정합·config 검사). 네트워크 이슈 등
      # 프로젝트 외적 요인으로 흔들릴 수 있어 실패해도 빌드는 막지 않는다(경고용).
      - name: Expo doctor (non-blocking)
        run: npx expo-doctor@latest || echo "::warning::expo-doctor reported issues"

  # 웹 E2E — Metro 웹 번들 + 런타임(sqlite wasm 포함) 회귀 검출.
  # 근거: web.output 설정 오류·react-native-web testID 회귀를 실제로 잡아낸 이력 (2026-07)
  e2e:
    name: E2E (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version/config sync check
        run: npm run sync:version:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
