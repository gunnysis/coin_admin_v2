# main push 시 단위 테스트 실행. EAS 빌드 전 CI 확인용.
name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version sync check
        run: npm run sync:version:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
