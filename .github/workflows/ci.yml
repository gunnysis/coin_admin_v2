# main push 시 단위 테스트 실행. EAS 빌드 전 CI 확인용.
name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Version sync check
        run: npm run sync:version:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # 의존성 호환성 진단 (SDK-패키지 버전 정합·config 검사). 네트워크 이슈 등
      # 프로젝트 외적 요인으로 흔들릴 수 있어 실패해도 빌드는 막지 않는다(경고용).
      - name: Expo doctor (non-blocking)
        run: npx expo-doctor@latest || echo "::warning::expo-doctor reported issues"
