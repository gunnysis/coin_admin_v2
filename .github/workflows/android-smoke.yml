# Android 릴리스 스모크 테스트 — 프로덕션 변형(release variant) 앱이 "실제로 켜지는지" 검증.
#
# 배경(2026-07-28 사고): SDK 57 업그레이드 후 릴리스 빌드가 시작 즉시 크래시
# (nativewind 중첩 react-native-css-interop@0.2.1이 RN 0.86에서 Appearance.setColorScheme(null)
# 호출 → Kotlin non-null 파라미터 NPE). 단위 테스트·웹 E2E·expo-doctor 전부 통과 상태로
# 스토어까지 배포됨 — 네이티브 런타임을 실제로 실행하는 검증이 어디에도 없었기 때문.
#
# 한계: EAS 워크플로(main push → 빌드·제출)는 이 job의 결과를 기다리지 않으므로
# 이 워크플로는 "차단 게이트"가 아니라 "조기 경보"다. 차단은 배포 전 로컬 스모크
# (docs/deployment/production-deployment.md 체크리스트)와 Sentry 크래시 알림이 보완한다.
name: Android Smoke

on:
  push:
    branches: [main]
    # EAS paths 필터와 동일한 취지 — 문서·워크플로만 변경된 push는 네이티브 스모크 불필요
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".eas/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Release build + emulator launch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # CNG: android/는 저장소에 없음 — app.config.ts에서 생성 (프로덕션과 동일 조건)
      - name: Prebuild (android, production)
        run: npx expo prebuild --platform android --no-install
        env:
          APP_ENV: production

      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      # ubuntu 러너에서 HW 가속 에뮬레이터 실행에 필요 (GitHub 공식 KVM 활성화 절차)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c || true
            adb shell monkey -p com.gunny.coinadmin.android -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -b crash -d > crash.log || true
            PID=$(adb shell pidof com.gunny.coinadmin.android || true)
            if [ -z "$PID" ]; then echo "::error::앱 프로세스가 실행 직후 종료됨 (시작 크래시)"; cat crash.log; exit 1; fi
            if grep -q "FATAL EXCEPTION" crash.log; then echo "::error::crash 버퍼에 FATAL EXCEPTION 존재"; cat crash.log; exit 1; fi
            echo "Smoke OK — process $PID alive, no fatal exceptions"

      - name: Upload crash log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-crash-log
          path: crash.log
          retention-days: 14
          if-no-files-found: ignore
